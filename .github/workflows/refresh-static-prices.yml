name: Refresh static price table

# The price table baked into index.html is what search crawlers and
# no-JavaScript visitors see. prices.json is committed directly by the
# publish function, which never touches index.html, so without this the
# static copy drifts out of date.
#
# Runs after the usual weekly update windows and commits only when the
# generated table actually changes, so Netlify builds stay infrequent.

on:
  schedule:
    - cron: '20 6 * * *'   # daily, 06:20 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the diff without committing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate static table from prices.json
        id: gen
        run: node scripts/refresh-static-prices.js

      - name: Show diff
        run: git --no-pager diff --stat -- index.html && git --no-pager diff -- index.html | head -40

      - name: Commit if changed
        if: ${{ inputs.dry_run != true }}
        run: |
          if git diff --quiet -- index.html; then
            echo "No change to static table."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh static price table for crawlers [skip ci]"
          git pull --rebase origin main
          git push origin main
