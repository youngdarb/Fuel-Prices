name: Android build (TWA)

# Builds the Google Play app bundle with Bubblewrap, signed with the
# existing upload key, targeting the API level Google currently requires.
on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "Play version code (must increase each upload)"
        default: "2"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Pre-seed Bubblewrap config so it never prompts
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<CFG
          {"jdkPath":"$JAVA_HOME","androidSdkPath":"$HOME/.bubblewrap/android_sdk"}
          CFG
          cat "$HOME/.bubblewrap/config.json"

      - name: Restore signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$HOME/signing.keystore"

      - name: Init TWA project
        run: |
          mkdir -p twa && cd twa
          yes y | bubblewrap init \
            --manifest=https://gsyfuel.co.uk/manifest.json \
            --directory=. \
            --packageId=com.gsyfuelprices \
            --appVersionCode=${{ inputs.versionCode }} \
            --appVersionName=${{ inputs.versionCode }}.0.0 \
            --signingKeyPath="$HOME/signing.keystore" \
            --signingKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} \
            --skipPwaValidation --yes

      - name: Build signed bundle
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd twa
          yes y | bubblewrap build --skipPwaValidation
          echo "--- target sdk ---"
          grep -rn "targetSdkVersion\|targetSdk" app/build.gradle 2>/dev/null | head -3 || true
          ls -la *.aab

      - uses: actions/upload-artifact@v4
        with:
          name: gsyfuel-android-aab
          path: twa/*.aab
          retention-days: 14
